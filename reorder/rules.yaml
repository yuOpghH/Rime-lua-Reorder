# reorder/rules.yaml — 簡碼／衍生碼規則（1.4.0）
# =============================================================
# 【作用域】本檔的規則只作用於「本工具管理的詞」：
#   extra.tsv 裡的詞、vocab.txt 新建的詞、以及本工具重算出的輔助碼。
#   引擎原生詞庫（*.dict.yaml／build\）的碼不讀、不寫、也碰不到。
#
# 不定碼連續輸入（前綴分段匹配／DP）：on 開啟、off 關閉（預設 on）。
#   只影響「任意不定碼連續輸入」這條路徑（例 szwsisqnlurr）；
#   formula／derive／xform／abbrev／fuzz 固定簡碼與連寫碼不受影響。
prefix_match: on
#
# strict_spelling: true 時，帶 fuzz／abbrev 屬性的碼不能單獨出「單字」
#   （只能參與詞組）；false／off＝照舊可用。預設 off。
strict_spelling: off
#
# 這個檔案決定「加入新詞時，除了主碼之外還要自動產生哪些碼」。
#
# 【基本觀念】
#   主碼＝你加入新詞時輸入的那串碼，用空白分段；第 k 段就是第 k 個字的
#   全碼（例：aa bb cc dd ＝「一 石 二 鳥」四段；碼為示意，實際以方案為準）。
#   規則只從這些分段再取碼或改寫，不會改動你的主碼。
#
# 【檔案結構】
#   - 井號（#）之後到行尾都是註解，可寫整行或行尾。
#   - 空行、不認識的行會被忽略，不影響其他規則。
#   - formula 規則寫在 rules: 之下；四算子（derive／xform／abbrev／fuzz）
#     寫成一行，前面加 - 或不加都可以。
#
# 【一、字數條件】
#   length_equal: N          詞長度「正好」N 個字（單字就用 length_equal: 1）
#   length_in_range: [a, b]  詞長度 a..b（含頭含尾）
#   length_in_range: [a, ]   至少 a 個字（無上限）
#   length_in_range: [a]     同上，「a 及以上」，不是「正好 a」！
#
#   ※ 重要：length_in_range: [N] 是「N 及以上」。要正好 N 個字，
#     請用 length_equal: N。要把規則管到單字，就用 length_equal: 1。
#
#   formula 的多組規則可並存，但同一個詞只採用「最貼近」的一組：在所有
#   符合字數的規則裡取 min 最大（下限最高）的那組，只有這組的 formula 會套用。
#   （例：4 字詞只套 min=4 的規則，不會再套 [3] 的規則。）
#
# 【二、formula：字序＋碼位，兩兩一組】
#   第 1、3、5…個字元（大寫）＝要取第幾個字：
#       A＝第 1 字、B＝第 2 字、C＝第 3 字……Z＝最後一個字（不是第 26 字）
#   第 2、4、6…個字元（小寫）＝要取該字第幾碼：
#       a＝第 1 碼、b＝第 2 碼、c＝第 3 碼……z＝該段的最後一碼
#
#   例（詞「四時小路」，主碼 szwc siai sqnc lurr）：
#       "AaBaCa"        → s s s        ＝ sss
#       "AaBaCaDaDc"    → s s s l r    ＝ ssslr
#       "AaZd"          → s r          ＝ sr
#       "ZaZd"          → l r          ＝ lr
#
#   formula 產生的碼是「逐字取碼直接串接」，本身不含空白。
#   要「含空白的分段簡碼」，請用下面的算子。
#   （含空白的分段簡碼會自動多一條去空白連寫版，品質 −0.10。）
#
# 【三、四算子：derive／xform／abbrev／fuzz（逐段套用）】
#   格式：算子/pattern/replacement/     （整段完全匹配，可用 $1、$2…）
#   - derive ：原碼保留，另外再生成一條（模糊音、容錯拼寫）。
#   - abbrev ：生成帶「縮略」屬性的碼（首字母簡拼）。
#   - xform  ：只生成改寫後的碼，原碼不再生成（derive 的對偶）。
#   - fuzz   ：生成帶「模糊」屬性的碼（沿用舊語義：全域、不分字數）。
#
#   字數範圍：fuzz 一律全域；derive／xform／abbrev 寫在某個 length_* 之後
#   就只套用該區段，寫在任何 length_* 之前＝不分字數。
#   書寫順序：derive 與 xform 撞同一條碼時，後寫的覆蓋先寫的。
#   xform 改寫主碼本身時，該詞在執行期只從改寫後的碼出現；
#   extra.tsv 的原行不會被刪（主碼與使用者自訂碼絕不刪）。
#
#   例：平捲舌模糊（zh、ch、sh 另外生成 z、c、s）
#       derive/^([zcs])h/$1/
#   例：取每段首字母作簡拼（只留縮略碼，不保留原形）
#       abbrev/^([a-z]).+$/$1/
#   例：把每段尾碼 h 去掉（只留改寫後的碼）
#       xform/^([a-z]+)h$/$1/
#   例：每段取前 2 碼（四時小路 → sz si sq lu）
#       fuzz/^([a-z;]{2}).+$/$1/
#
#   支援的正則：^  $  .  [abc]  [^abc]  (...)  *  +  ?  {n}  {n,m}  |  \x
#   注意：pattern 內不要出現 /（最外層兩個 / 是分隔符）。
#
# 【四、品質（數字越大越前面）】
#   主碼 4.90（extra.tsv 不寫第 3 欄）。
#   最貼近的一組 formula：第 1 條 4.70，之後每條 −0.20。
#   四算子：從「4.70 − 0.20 × formula 條數（不足 1 以 1 計）」起，每條 −0.20；
#   彼此可並存，各自生成碼，依書寫順序遞減。
#   分段簡碼的連寫版：再 −0.10。下限 1.00。
#
# 【五、重算（清掉過期衍生碼）】
#   工作台托盤右鍵 →「按目前規則重算衍生碼（先備份）」：
#   先備份 extra.tsv 到 reorder\_backup\ecalc-*，再刪掉規則已不再產生的
#   舊衍生碼；主碼與使用者自訂的碼不動。
#
# 【六、常見錯誤（該條規則略過，其餘照跑；工作台左下會標行號）】
#   - 寫了 formula 卻沒有先給 length_equal／length_in_range。
#   - formula 長度為奇數，或大小寫順序錯（應成對，如 AaB）。
#   - formula 內含空白（要寫成 AaBa；"Aa Ba" 會因空白被略過）。
#   - length_equal ≤ 0；length_in_range 上限小於下限。
#   - 把「正好 N 個字」誤寫成 length_in_range: [N]（那是 N 及以上）。
#   - 未知記號（例如把碼位寫成數字 1）。
#   - 主碼段數 ≠ 詞的字數（例主碼 2 段卻對 3 字詞）→ 該詞不產生這條。
#   - 某段碼不夠長（例要第 3 碼，但該段只有 2 碼）→ 該條略過。
#   - 算子沒以 / 結尾、缺 pattern 或 replacement、正則寫錯。
#
rules:
  - length_equal: 2
    formula: "AaAbBaBb"
  - length_in_range: [3]
    formula: "AaBaCa"
  - length_in_range: [4]
    formula: "AaBaCaDaDc"
# 想要「分段簡碼」可再加一行（例：每段取前 2 碼；fuzz 不分字數）：
# fuzz/^([a-z;]{2}).+$/$1/
